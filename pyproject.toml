[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bohr-h-andresdperezc"
version = "0.1.0"
description = "Modelo de Bohr para hidrógeno y átomos hidrogenoides: energías, radios, transiciones y gráficos."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrés David Pérez Criollo", email = "adperezc@udistrital.edu.co" },
]
keywords = ["física", "Bohr", "hidrógeno", "hidrogenoide", "educación"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
gui = ["streamlit>=1.28"]
dev = ["pytest>=7", "build", "twine"]
docs = ["sphinx", "furo", "myst-parser"]

[tool.setuptools.packages.find]
where = ["src"]
